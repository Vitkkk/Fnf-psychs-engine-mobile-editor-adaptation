name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-smoke-build.yml

concurrency:
  group: psych-mobile-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_SETUP: 'true'
      HXCPP_COMPILE_THREADS: '4'

    steps:
      - name: Checkout mobile editor branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-editor-milestone-1

      - name: Setup Haxe 4.2.5
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'

      - name: Restore Haxe libraries
        id: haxelib-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/haxelib
            ~/.lime
          key: psych-haxelib-v4-${{ runner.os }}-haxe425-lime832-openfl952-hxcpp432-flixel411
          restore-keys: |
            psych-haxelib-v4-${{ runner.os }}-
            psych-haxelib-v3-${{ runner.os }}-

      - name: Restore hxcpp object cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.hxcpp_cache
          key: psych-hxcpp-arm64-v2-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            psych-hxcpp-arm64-v2-${{ runner.os }}-
            psych-hxcpp-arm64-v1-${{ runner.os }}-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: psych-gradle-android31-${{ runner.os }}-${{ hashFiles('Project.xml') }}
          restore-keys: |
            psych-gradle-android31-${{ runner.os }}-

      - name: Use JDK 17 for Android SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK and NDK are present
        shell: bash
        run: |
          set -euo pipefail
          NEED_INSTALL=0
          [ -d "$ANDROID_SDK_ROOT/platforms/android-31" ] || NEED_INSTALL=1
          [ -d "$ANDROID_SDK_ROOT/build-tools/31.0.0" ] || NEED_INSTALL=1
          [ -d "$ANDROID_SDK_ROOT/ndk/21.4.7075529" ] || NEED_INSTALL=1

          if [ "$NEED_INSTALL" = "1" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/9.0/bin/sdkmanager"
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platform-tools' 'platforms;android-31' 'build-tools;31.0.0' 'ndk;21.4.7075529'
          else
            echo "Android 31 + NDK r21e already available; skipping sdkmanager download."
          fi

      - name: Use JDK 11 for legacy Lime build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Configure exact Haxe toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/haxelib" "$HOME/.hxcpp_cache"
          haxelib setup "$HOME/haxelib"

          ensure_haxelib() {
            LIB="$1"
            VERSION="$2"
            if ! haxelib list | grep -q "^${LIB}:.*\[${VERSION}\]"; then
              haxelib install "$LIB" "$VERSION" --quiet
            fi
          }

          ensure_haxelib lime 8.3.2
          ensure_haxelib openfl 9.5.2
          ensure_haxelib hxcpp 4.3.2
          ensure_haxelib flixel 4.11.0
          ensure_haxelib flixel-addons 2.11.0
          ensure_haxelib flixel-ui 2.4.0
          ensure_haxelib hscript 2.7.0
          ensure_haxelib actuate 1.9.0
          ensure_haxelib linc_luajit 0.0.7
          ensure_haxelib hxvm-luajit 0.0.0

          if ! haxelib list | grep -q '^extension-webview:'; then
            haxelib git extension-webview https://github.com/HaxeExtension/extension-webview.git master --quiet
          fi

          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set hxcpp 4.3.2
          haxelib set flixel 4.11.0
          haxelib set flixel-addons 2.11.0
          haxelib set flixel-ui 2.4.0

          cat > "$HOME/.hxcpp_config.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <xml>
            <section id="vars">
              <set name="HXCPP_COMPILE_CACHE" value="$HOME/.hxcpp_cache" />
              <set name="HXCPP_CACHE_MB" value="6000" />
              <set name="HXCPP_COMPILE_THREADS" value="4" />
            </section>
          </xml>
          EOF

          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

          echo "=== Toolchain ==="
          haxe --version
          haxelib list
          haxelib run hxcpp cache list || true

      - name: Save Haxe libraries
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/haxelib
            ~/.lime
          key: psych-haxelib-v4-${{ runner.os }}-haxe425-lime832-openfl952-hxcpp432-flixel411

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting one ARM64 build. Compiler failures will stop here and remain visible."
          time haxelib run lime build android -debug -arm64

      - name: Save hxcpp object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.hxcpp_cache
          key: psych-hxcpp-arm64-v2-${{ runner.os }}-${{ github.run_number }}

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          find export -type f -name '*.apk' -print
          APK_COUNT=$(find export -type f -name '*.apk' | wc -l)
          if [ "$APK_COUNT" -lt 1 ]; then
            echo "Build completed but no APK was produced."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-MobileEditor-M1-ARM64
          path: export/**/*.apk
          if-no-files-found: error
          compression-level: 0
