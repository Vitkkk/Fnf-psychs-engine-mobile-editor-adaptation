name: Android smoke build

on:
  push:
    branches: [main]
    paths: [.github/workflows/android-smoke-build.yml]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-editor-milestone-1
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK r21e
        run: sdkmanager 'ndk;21.4.7075529'
      - name: Configure haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib install extension-webview --quiet
          haxelib install linc_luajit --quiet
          haxelib install hxvm-luajit --quiet
      - name: Configure Lime Android paths
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
      - name: Build debug APK
        run: haxelib run lime build android -debug
      - name: Locate APK
        if: success()
        run: find export -type f -name '*.apk' -print
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-MobileEditor-M1
          path: export/**/*.apk
          if-no-files-found: error
