name: Android smoke build

on:
  push:
    branches: [main]
    paths: [.github/workflows/android-smoke-build.yml]

concurrency:
  group: psych-mobile-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_SETUP: 'true'
      HXCPP_COMPILE_THREADS: '4'
      BUILD_TRIGGER: '18'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-editor-milestone-1

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'

      - name: Restore Haxe environment
        id: haxelib-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/haxelib
            ~/.lime
          key: psych-haxelib-v3-${{ runner.os }}-haxe425-lime832-openfl952-hxcpp432-flixel411

      - name: Restore hxcpp compile cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.hxcpp_cache
          key: psych-hxcpp-arm64-v1-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            psych-hxcpp-arm64-v1-${{ runner.os }}-

      - name: Use JDK 17 for Android SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK pieces and NDK r21e
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/9.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-31' 'build-tools;31.0.0' 'ndk;21.4.7075529'

      - name: Switch to JDK 11 for legacy Lime Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Configure Haxe libraries
        run: |
          mkdir -p "$HOME/haxelib" "$HOME/.hxcpp_cache"
          haxelib setup "$HOME/haxelib"
          ensure_haxelib() {
            LIB="$1"
            VERSION="$2"
            if haxelib list | grep -q "^${LIB}:.*\[${VERSION}\]"; then return 0; fi
            haxelib install "$LIB" "$VERSION" --quiet
          }
          ensure_haxelib lime 8.3.2
          ensure_haxelib openfl 9.5.2
          ensure_haxelib hxcpp 4.3.2
          ensure_haxelib flixel 4.11.0
          ensure_haxelib flixel-addons 2.11.0
          ensure_haxelib flixel-ui 2.4.0
          ensure_haxelib hscript 2.7.0
          ensure_haxelib actuate 1.9.0
          if ! haxelib list | grep -q '^extension-webview:'; then haxelib git extension-webview https://github.com/HaxeExtension/extension-webview.git master --quiet; fi
          ensure_haxelib linc_luajit 0.0.7
          ensure_haxelib hxvm-luajit 0.0.0
          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set hxcpp 4.3.2
          haxelib set flixel 4.11.0
          haxelib set flixel-addons 2.11.0
          haxelib set flixel-ui 2.4.0

          cat > "$HOME/.hxcpp_config.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <xml>
            <section id="vars">
              <set name="HXCPP_COMPILE_CACHE" value="$HOME/.hxcpp_cache" />
              <set name="HXCPP_CACHE_MB" value="6000" />
              <set name="HXCPP_COMPILE_THREADS" value="4" />
            </section>
          </xml>
          EOF

      - name: Save Haxe environment
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/haxelib
            ~/.lime
          key: psych-haxelib-v3-${{ runner.os }}-haxe425-lime832-openfl952-hxcpp432-flixel411

      - name: Configure Lime Android paths
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run hxcpp cache list || true

      - name: Build debug APK ARM64
        id: apk-build
        continue-on-error: true
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 600s haxelib run lime build android -debug -arm64
          CODE=$?
          pkill -TERM -f 'clang\+\+.*android64' || true
          sleep 3
          pkill -KILL -f 'clang\+\+.*android64' || true
          find "$HOME/.hxcpp_cache" -type f -name '*.tmp' -delete 2>/dev/null || true
          sync
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit "$CODE"

      - name: Save hxcpp compile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.hxcpp_cache
          key: psych-hxcpp-arm64-v1-${{ runner.os }}-${{ github.run_number }}

      - name: Require successful APK build
        if: steps.apk-build.outcome != 'success'
        run: exit 1

      - name: Locate APK
        run: find export -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-MobileEditor-M1-ARM64
          path: export/**/*.apk
          if-no-files-found: error
