name: Android Haxe check

on:
  push:
    branches: [main]
    paths: [.github/workflows/android-haxe-check.yml]

jobs:
  haxe-check:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_SETUP: 'true'
      CHECK_REVISION: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-editor-milestone-1
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'
      - name: Use JDK 17 for Android SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK pieces
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/9.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-31' 'build-tools;31.0.0' 'ndk;21.4.7075529'
      - name: Switch to JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Haxe dependencies except hxcpp
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install flixel-ui 2.4.0 --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib git extension-webview https://github.com/HaxeExtension/extension-webview.git master --quiet
          haxelib install linc_luajit --quiet
          haxelib install hxvm-luajit --quiet
          haxelib set flixel 4.11.0
          haxelib set flixel-addons 2.11.0
          haxelib set flixel-ui 2.4.0
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
      - name: Typecheck Android Haxe sources
        run: |
          set +e
          haxelib run lime build android -debug -arm64 2>&1 | tee /tmp/haxe-check.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -eq 0 ]; then
            exit 0
          fi
          if grep -Fq 'Library hxcpp is not installed' /tmp/haxe-check.log; then
            echo 'Haxe typecheck passed; stopped intentionally before native hxcpp compilation.'
            exit 0
          fi
          echo 'Haxe typecheck failed before native compilation.'
          exit "$CODE"
