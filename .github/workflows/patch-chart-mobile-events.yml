name: Patch mobile editor integrations

on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-chart-mobile-events.yml]

permissions:
  contents: write

env:
  PATCH_REVISION: '6'

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-editor-milestone-1
          fetch-depth: 0
      - name: Patch ChartingState
        run: python3 tools/patch_chart_mobile_events.py
      - name: Patch WeekEditorState
        run: python3 tools/patch_week_mobile_characters.py
      - name: Commit patches
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/editors/ChartingState.hx source/editors/WeekEditorState.hx
          git commit -m 'Integrate visual Chart character picker'
          git push origin HEAD:agent/mobile-editor-milestone-1
